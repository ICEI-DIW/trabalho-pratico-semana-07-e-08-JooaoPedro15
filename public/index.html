<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Faketube - Home</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" href="./styles.css">
</head>
<body>


  <header class="bg-success text-white p-3">
    <div class="container d-flex align-items-center">
      <img src="img/logo.png" alt="Logo Faketube" class="me-3" style="max-width:120px;">
      <h1>Faketube</h1>
    </div>
  </header>


  <section class="container my-4">
    <h2 class="mb-3">Itens Populares</h2>
    <div id="carouselPopular" class="carousel slide" data-bs-ride="carousel">
      <div class="carousel-inner" id="carousel-inner-destaques">

      </div>
      <button class="carousel-control-prev" type="button" data-bs-target="#carouselPopular" data-bs-slide="prev">
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Anterior</span>
      </button>
      <button class="carousel-control-next" type="button" data-bs-target="#carouselPopular" data-bs-slide="next">
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Próximo</span>
      </button>
    </div>
  </section>


  <section class="container my-4">
    <h2 class="mb-3">Todos os Itens</h2>
    <div class="row" id="cards-container">

    </div>
  </section>


  <section class="container my-4">
    <h2 class="mb-3">Sobre o Aluno</h2>
    <div class="card">
      <div class="card-body">
        <p><strong>Nome:</strong> João Pedro Costa e Silva</p>
        <p><strong>Matrícula:</strong> 891500</p>
        <p><strong>Projeto:</strong> Layout estilo YouTube - Faketube</p>
      </div>
    </div>
  </section>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script src="./app.js"></script>
</body>
</html>
