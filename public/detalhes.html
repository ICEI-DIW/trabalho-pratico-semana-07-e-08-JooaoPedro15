<body>

  <header class="bg-success text-white p-3 sticky-top">
    <div class="container">
      <div class="d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center">
          <img src="img/logo.png" alt="Logo Faketube" class="me-3" style="max-width:80px;">
          <h1 class="mb-0 fs-3">Faketube</h1>
        </div>
        <nav>
          <ul class="nav">
            <li class="nav-item">

            <li class="nav-item">
              <a class="nav-link text-white" href="index.html#todos-videos"><i class="bi bi-collection-play"></i> Vídeos</a>

        </div>
      </div>

    <h3 class="mb-3 border-start border-success border-4 ps-2">Vídeos Relacionados</h3>
    <div id="videos-relacionados" class="row g-3 mb-4">

    </div>
    

    <div class="d-grid gap-2 d-md-flex justify-content-md-start mb-4">
      <button class="btn btn-success" id="btn-voltar">
        <i class="bi bi-arrow-left"></i> Voltar para Home
      </button>
    </div>
  </main>


  <footer class="bg-dark text-white py-4 mt-5">
    <div class="container">
      <div class="row">
        <div class="col-md-6">
          <h5>FakeTube</h5>
